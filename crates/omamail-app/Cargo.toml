[package]
name = "omamail-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "OmaMail application services: paths, keyring, theme, CLI."

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
clap = { version = "4", features = ["derive"] }
omamail-core = { path = "../omamail-core" }
omamail-google = { path = "../omamail-google" }
omamail-store = { path = "../omamail-store" }
omamail-sync = { path = "../omamail-sync" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
rpassword = "7"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native-sync-persistent", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[dev-dependencies]
tokio = { workspace = true }
